global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fastapi-backend"
    dns_sd_configs:
      - names:
          - "backend"
        type: "A"
        port: 8000
    metrics_path: /metrics

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis_exporter:9121"]