limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # handles /:shortCode routes
    }

    # FastAPI — proxied internally, port 8000 never exposed publicly
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        rewrite ^ /api/internal/rate-limited break;
        proxy_pass http://backend:8000;
    }

    # Optional: FastAPI docs
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /alb-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Prometheus scrapes backend metrics through nginx, since backend:8000
    # is never exposed directly. Restricted to the monitoring instance's
    # private IP — same defense-in-depth pattern as /grafana's auth_basic.
    location /metrics {
        allow <MONITORING_INSTANCE_PRIVATE_IP>/32;
        deny all;
        proxy_pass http://backend:8000/metrics;
        proxy_set_header Host $host;
    }

    # Grafana dashboards — operator-facing, gated behind basic auth
    # in front of Grafana's own login (defense in depth). proxy_pass
    # deliberately has NO trailing URI (http://grafana:3000, not
    # http://grafana:3000/) so nginx forwards the full /grafana/...
    # path through unmodified, rather than stripping the /grafana
    # prefix. Grafana is configured via GF_SERVER_SERVE_FROM_SUB_PATH
    # (see docker-compose.yml) to expect requests to arrive with that
    # prefix intact — if nginx strips it, Grafana sees "/" instead of
    # "/grafana/" and 301-redirects back to its own root, which looks
    # like a redirect loop from the outside (hit this during setup).
    location /grafana/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # proxy_pass http://grafana:3000;
        # Grafana now runs on the dedicated monitoring instance, not this
        # host. Docker DNS resolution ("grafana") no longer applies once
        # nginx and Grafana are on different EC2 instances.
        proxy_pass http://<MONITORING_INSTANCE_PRIVATE_IP>:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live (websocket) support — dashboards auto-refresh
        # over a websocket connection; without this upgrade, panels
        # would silently fall back to polling or fail to live-update.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}