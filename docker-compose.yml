services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: urlshortener-pgbouncer
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:5432/${RDS_DB}"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200        # connections FROM backend replicas TO pgbouncer
      DEFAULT_POOL_SIZE: 15       # connections FROM pgbouncer TO RDS
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      ADMIN_USERS: ${RDS_USER}
    expose:
      - "6432"
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: .env
    environment:
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: 6432        # was 5432 — now pointing at pgbouncer, not Postgres directly
      REDIS_HOST: redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --timeout-graceful-shutdown 30
    expose:
      - "8000"
    networks:
      - public
      - private
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 2

  frontend:
    build: ./frontend
    container_name: urlshortener-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    networks:
      - public
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    expose:
      - "9100"
    networks:
      - public
  
  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "rediss://${REDIS_HOST}:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - public
      - private

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:5432/${RDS_DB}?sslmode=require"
    command:
      - "--collector.stat_statements"
    expose:
      - "9187"
    networks:
      - public
      - private

networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: